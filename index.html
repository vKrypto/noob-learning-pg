<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>noob-learning-pg</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1f1f1f; --muted: #666; --accent: #2f6fdb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161616; --fg: #ececec; --muted: #9a9a9a; --accent: #7aa7ff; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    main { max-width: 560px; text-align: center; }
    h1 { font-size: 2rem; margin: 0 0 .5rem; }
    p { color: var(--muted); line-height: 1.5; }
    code { color: var(--accent); }
    .wave { font-size: 3rem; margin: 0; display: inline-block; animation: wave 2s ease-in-out infinite; transform-origin: 70% 70%; }
    @keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(14deg); } 20% { transform: rotate(-8deg); } }
    @media (prefers-reduced-motion: reduce) { .wave { animation: none; } }
  </style>
</head>
<body>
  <main>
    <p class="wave">👋</p>
    <h1>Hello, World!</h1>
    <p>Welcome to <strong>noob-learning-pg</strong> — a demo page deployed to GitHub Pages with GitHub Actions.</p>
    <p>If you can read this, the build-and-deploy pipeline is working end to end.</p>
    <p>Edit <code>index.html</code> and push to <code>main</code> to update this site.</p>
  </main>
</body>
</html>
