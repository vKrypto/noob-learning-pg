<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DayNest — Daily Task Organizer</title>
  <meta name="description" content="Organize your daily tasks, reminders, birthdays and routines.">
  <meta name="theme-color" content="#2f6f5e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem('dn.theme') || '{}');
      if (t.mode && t.mode !== 'system') document.documentElement.dataset.theme = t.mode;
      if (t.accent) document.documentElement.style.setProperty('--accent', t.accent);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>DayNest needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
